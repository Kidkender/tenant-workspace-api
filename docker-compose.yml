x-laravel: &laravel
    build:
        context: .
        dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
        - ./:/var/www
    environment:
        DB_HOST: mysql
        REDIS_HOST: redis
        CACHE_STORE: redis
        QUEUE_CONNECTION: redis

services:
    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: tenant-workspace-db
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot",
                ]
            interval: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            retries: 10

    migrate:
        <<: *laravel
        command: php artisan migrate --force
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: "no"

    app:
        <<: *laravel
        command: php-fpm
        depends_on:
            migrate:
                condition: service_completed_successfully

    queue:
        <<: *laravel
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600 --memory=512
        depends_on:
            migrate:
                condition: service_completed_successfully

    scheduler:
        <<: *laravel
        command: php artisan schedule:work
        depends_on:
            migrate:
                condition: service_completed_successfully

    reverb:
        <<: *laravel
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "8080:8080"
        depends_on:
            migrate:
                condition: service_completed_successfully

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

volumes:
    mysql_data:
    redis_data:
